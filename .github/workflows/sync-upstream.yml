# ============================================================
# 設計契約
# ------------------------------------------------------------
# 目的:
#   upstream (kawa-nobu/Open-Deck) の Release を fork の Release (完全ミラー)
#   へ fast-forward 同期し、その後 Release の内容を custom (default branch、
#   個人カスタマイズ置き場) へ自動マージする。コンフリクト時は Release→custom
#   の PR を作成して自動マージを断念し、後続の解決 (定期実行の Claude Code
#   エージェントまたは手動) に委ねる。
#
# 前提:
#   Release には個人コミットを置かない。fast-forward 前提が崩れると同期ステ
#   ップは失敗するが、それは意図した挙動である。
#
# token 契約:
#   認証は github.token のみ。制約:
#     (a) upstream の変更に .github/workflows/ 配下のファイルが含まれる場合、
#         Release への同期ステップは失敗する。これは CI 定義が無審査で流入
#         して secrets 付きで実行されることを防ぐ review gate として意図し
#         た挙動であり、その場合はローカルから手動同期する
#         (git fetch upstream → git push origin upstream/Release:Release)。
#         手動同期後の custom への自動マージも github.token では拒否される
#         ため、workflow は同期 PR を作成して手動マージに委ねる
#     (b) コンフリクト時の PR 作成には、リポジトリ設定「Allow GitHub Actions
#         to create and approve pull requests」の有効化が前提
#     (c) workflow 定義の gate (a) に加えて、CI から実行されるセンシティブ
#         パス (.github/ 配下、package.sh、package.ps1) の変更を含む同期は
#         自動マージせず、同期 PR を作成して手動レビューに委ねる。それ以外
#         のファイルの upstream 変更は無審査で custom へ自動マージされる
#
# エラー方針:
#   自動マージ不能 (コンフリクト / workflow 権限拒否 / センシティブパス検知)
#   は正常系として扱い、同期 PR を作成して workflow は成功終了する。それ以
#   外の API エラー (403/422 等) は権限・設定異常として workflow を失敗さ
#   せる。
# ============================================================

name: Sync upstream

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # 入力: upstream リポジトリ (kawa-nobu/Open-Deck) の Release ブランチ
      # 処理: gh repo sync により fork の Release を upstream の Release へ
      #       fast-forward 同期する (--force は付けない)。diverge している
      #       場合、および upstream の変更に .github/workflows/ 配下のファ
      #       イルが含まれる場合はこのステップが失敗し、workflow は失敗
      #       終了する契約。同期元は --source で明示し、GitHub 上の
      #       fork-parent メタデータに依存しない
      - name: Sync Release from upstream (fast-forward)
        id: sync
        shell: bash
        run: gh repo sync "$GITHUB_REPOSITORY" --source kawa-nobu/Open-Deck --branch Release

      # 入力: 同期済みの Release ブランチ
      # 処理: gh api で Release ブランチの最新 commit SHA を取得する。取得
      #       できなかった場合は ::error:: を出して exit 1 (fail-fast)
      # 出力: 取得した SHA を step output `sha` として公開する
      - name: Get Release SHA
        id: get_sha
        shell: bash
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/Release" --jq .commit.sha)
          if [ -z "$sha" ]; then
            echo "::error::Release ブランチの commit SHA を取得できませんでした"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # 入力: custom と Release の SHA (前ステップの `sha`) の比較
      # 処理: 取り込まれる差分ファイル一覧を取得し、センシティブパス
      #       (.github/ 配下、package.sh、package.ps1) が含まれるか判定
      #       する。files 300 件到達または commits 250 件超のいずれかで
      #       fail-closed とする
      # 出力: 判定結果を step output `sensitive` (true / false) として
      #       公開する
      - name: Check sensitive paths
        id: check_paths
        shell: bash
        env:
          HEAD_SHA: ${{ steps.get_sha.outputs.sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::HEAD_SHA (Release の commit SHA) が空です"
            exit 1
          fi

          compare=$(gh api "repos/${GITHUB_REPOSITORY}/compare/custom...${HEAD_SHA}")
          total_commits=$(echo "$compare" | jq -r '.total_commits')
          file_count=$(echo "$compare" | jq -r '.files | length')
          files=$(echo "$compare" | jq -r '.files[].filename')

          sensitive=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/*|package.sh|package.ps1)
                sensitive=true
                ;;
            esac
          done <<< "$files"

          # compare API の切り詰め 2 経路 (files 最大 300 件 / commits 250 件超で
          # files 一覧が不完全になりうる) のいずれかに該当する場合は、一覧が完全で
          # ある保証が無いため fail-closed でセンシティブ扱いとする
          if [ "$file_count" -ge 300 ] || [ "$total_commits" -gt 250 ]; then
            sensitive=true
          fi

          echo "sensitive=$sensitive" >> "$GITHUB_OUTPUT"
          echo "- sensitive paths: $sensitive (changed files: $file_count, commits: $total_commits)" >> "$GITHUB_STEP_SUMMARY"

      # 入力: 前ステップの step output `sha` (head)、`sensitive` 判定、
      #       base は custom ブランチ
      # 処理: sensitive が true の場合は API を呼ばず needs-manual とする。
      #       それ以外は POST /repos/{repository}/merges を実行し、結果で
      #       分岐する — exit 0 かつ応答が空: up-to-date (取り込み済み) /
      #       exit 0 かつ応答が非空: merged (マージ成功) /
      #       exit 非 0 かつ応答に "HTTP 409" を含む: needs-manual
      #       (reason=conflict) /
      #       exit 非 0 かつ応答に "refusing to allow" を含む: needs-manual
      #       (reason=workflow-permission) /
      #       それ以外: 権限・設定異常として workflow を失敗させる
      # 出力: マージ結果を step output `result` (merged / up-to-date /
      #       needs-manual のいずれか) として公開する。result が
      #       needs-manual の場合は step output `reason`
      #       (conflict / workflow-permission / sensitive-path) も公開する
      - name: Merge Release into custom
        id: merge
        shell: bash
        env:
          HEAD_SHA: ${{ steps.get_sha.outputs.sha }}
          SENSITIVE: ${{ steps.check_paths.outputs.sensitive }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::HEAD_SHA (Release の commit SHA) が空です"
            exit 1
          fi

          if [ "$SENSITIVE" = "true" ]; then
            echo "result=needs-manual" >> "$GITHUB_OUTPUT"
            echo "reason=sensitive-path" >> "$GITHUB_OUTPUT"
            echo "- merge result: needs-manual (sensitive-path)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          set +e
          response=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/merges" \
            -f base=custom \
            -f head="$HEAD_SHA" \
            -f commit_message="chore: upstream Release を custom に自動マージ" 2>&1)
          exit_code=$?
          set -e

          reason=""
          if [ "$exit_code" -eq 0 ] && [ -z "$response" ]; then
            result=up-to-date
          elif [ "$exit_code" -eq 0 ] && [ -n "$response" ]; then
            result=merged
          elif [ "$exit_code" -ne 0 ] && echo "$response" | grep -q "HTTP 409"; then
            result=needs-manual
            reason=conflict
          elif [ "$exit_code" -ne 0 ] && echo "$response" | grep -q "refusing to allow"; then
            result=needs-manual
            reason=workflow-permission
          else
            echo "$response" >&2
            exit 1
          fi

          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = "needs-manual" ]; then
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "- merge result: needs-manual ($reason)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- merge result: $result" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 入力: 前ステップの step output `result` と `reason`
      #       (needs-manual の場合のみ reason を PR 本文へ伝搬させる)
      # 処理: result が needs-manual の場合は、open な Release→custom PR
      #       が無ければ reason に応じた本文で作成する。result が merged
      #       または up-to-date の場合は逆に、残存する open な
      #       Release→custom PR があれば close する (close 失敗でも
      #       workflow は失敗させない。次回実行で再試行される)。PR の特定
      #       は base/head 名に加えて head リポジトリの owner 一致で行う
      #       (外部 fork 由来の同名ブランチ PR を対象にしない)
      - name: Reconcile sync PR
        id: reconcile
        shell: bash
        env:
          RESULT: ${{ steps.merge.outputs.result }}
          REASON: ${{ steps.merge.outputs.reason }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::error::RESULT (merge ステップの結果) が空です"
            exit 1
          fi

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base custom --head Release --state open \
            --json number,headRepositoryOwner \
            --jq '[.[] | select(.headRepositoryOwner.login == env.GITHUB_REPOSITORY_OWNER)][0].number // empty')

          case "$RESULT" in
            needs-manual)
              if [ -z "$pr_number" ]; then
                case "$REASON" in
                  workflow-permission)
                    cause="原因: CI 定義 (.github/workflows 配下) の変更を含むため、github.token では取り込めません。特権的な変更としてレビューしてください。"
                    ;;
                  sensitive-path)
                    cause="原因: センシティブパス (.github/ 配下・package.sh・package.ps1) の変更を含むため、自動マージを停止しました。内容をレビューのうえマージしてください。"
                    ;;
                  *)
                    cause="原因: マージコンフリクトが発生しました。"
                    ;;
                esac
                gh pr create --repo "$GITHUB_REPOSITORY" --base custom --head Release \
                  --title "upstream sync: Release → custom (要手動対応)" \
                  --body "upstream の Release を custom へ自動マージできませんでした。${cause} 解決方法: custom から作業ブランチを作成し、Release をマージして (コンフリクトがあれば解決して) PR で custom へ取り込んでください。取り込みは merge commit で行ってください (squash / rebase では次回の同期で同じコンフリクトが再検出されます)。取り込み完了後、この PR は次回の同期実行時に自動で close されます。"
                echo "- created sync PR" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- sync PR already open (#$pr_number)" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            merged|up-to-date)
              if [ -n "$pr_number" ]; then
                if gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" --comment "custom へ取り込み済みのため close します"; then
                  echo "- closed sync PR (#$pr_number)" >> "$GITHUB_STEP_SUMMARY"
                else
                  state=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null) || state=""
                  if [ "$state" = "CLOSED" ] || [ "$state" = "MERGED" ]; then
                    echo "- sync PR (#$pr_number) は既に close 済み" >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "::warning::sync PR (#$pr_number) の close に失敗しました (次回実行で再試行されます)"
                    echo "- sync PR (#$pr_number) の close に失敗 (open のまま)" >> "$GITHUB_STEP_SUMMARY"
                  fi
                fi
              else
                echo "- no open sync PR to close" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            *)
              echo "::error::想定外の RESULT 値です: $RESULT"
              exit 1
              ;;
          esac
