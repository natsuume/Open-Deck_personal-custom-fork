      #       fast-forward 同期する。diverge (fast-forward 不可) の場合はこの
      #       ステップが失敗し、workflow は失敗終了する契約
      - name: Sync Release from upstream (fast-forward)
        run: 'echo "TODO(Phase B): not implemented"'

      # 入力: 同期済みの Release ブランチ
      # 出力: Release の最新 commit SHA を step output `sha` として公開する
      #       (後続の Merge ステップが head として固定的に参照する)
      - name: Get Release SHA
        run: 'echo "TODO(Phase B): not implemented"'

      # 入力: 前ステップの step output `sha` (head)、base は custom ブランチ
      # 処理: POST /repos/{repository}/merges を実行し、HTTP ステータスで
      #       分岐する — 201: マージ成功 / 204: 取り込み済み (差分なし) /
      #       409: コンフリクト (次ステップへ処理を委譲) / その他: 権限・
      #       設定異常として workflow を失敗させる
      # 出力: マージ結果を step output `result` (merged / up-to-date /
      #       conflict のいずれか) として公開する
      - name: Merge Release into custom
        run: 'echo "TODO(Phase B): not implemented"'

