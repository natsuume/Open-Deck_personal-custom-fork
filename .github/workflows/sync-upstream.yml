# ============================================================
# 設計契約
# ------------------------------------------------------------
# 目的:
#   upstream (kawa-nobu/Open-Deck) の Release を fork の Release (完全ミラー)
#   へ fast-forward 同期し、その後 Release の内容を custom (default branch、
#   個人カスタマイズ置き場) へ自動マージする。コンフリクト時は Release→custom
#   の PR を作成して自動マージを断念し、後続の解決 (定期実行の Claude Code
#   エージェントまたは手動) に委ねる。
#
# 前提:
#   Release には個人コミットを置かない。fast-forward 前提が崩れると同期ステ
#   ップは失敗するが、それは意図した挙動である。
#
# token 契約:
#   認証は github.token のみ。制約:
#     (a) upstream の変更に .github/workflows/ 配下のファイルが含まれる場合、
#         同期ステップは失敗する。これは CI 定義が無審査で流入して secrets
#         付きで実行されることを防ぐ review gate として意図した挙動であり、
#         その場合はローカルから手動同期する
#         (git fetch upstream → git push origin upstream/Release:Release)
#     (b) コンフリクト時の PR 作成には、リポジトリ設定「Allow GitHub Actions
#         to create and approve pull requests」の有効化が前提
#
# エラー方針:
#   コンフリクト (HTTP 409) は正常系として扱い、workflow は成功終了する。
#   それ以外の API エラー (403/422 等) は権限・設定異常として workflow を
#   失敗させる。
# ============================================================

name: Sync upstream

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # 入力: upstream リポジトリ (kawa-nobu/Open-Deck) の Release ブランチ
      # 処理: gh repo sync により fork の Release を upstream の Release へ
      #       fast-forward 同期する (--force は付けない)。diverge している
      #       場合、および upstream の変更に .github/workflows/ 配下のファ
      #       イルが含まれる場合はこのステップが失敗し、workflow は失敗
      #       終了する契約
      - name: Sync Release from upstream (fast-forward)
        id: sync
        shell: bash
        run: gh repo sync "$GITHUB_REPOSITORY" --branch Release

      # 入力: 同期済みの Release ブランチ
      # 処理: gh api で Release ブランチの最新 commit SHA を取得する。取得
      #       できなかった場合は ::error:: を出して exit 1 (fail-fast)
      # 出力: 取得した SHA を step output `sha` として公開する
      - name: Get Release SHA
        id: get_sha
        shell: bash
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/branches/Release" --jq .commit.sha)
          if [ -z "$sha" ]; then
            echo "::error::Release ブランチの commit SHA を取得できませんでした"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # 入力: 前ステップの step output `sha` (head)、base は custom ブランチ
      # 処理: POST /repos/{repository}/merges を実行し、結果で分岐する —
      #       exit 0 かつ応答が空: up-to-date (取り込み済み) /
      #       exit 0 かつ応答が非空: merged (マージ成功) /
      #       exit 非 0 かつ応答に "HTTP 409" を含む: conflict (次ステップへ
      #       処理を委譲) / それ以外: 権限・設定異常として workflow を失敗
      #       させる
      # 出力: マージ結果を step output `result` (merged / up-to-date /
      #       conflict のいずれか) として公開する
      - name: Merge Release into custom
        id: merge
        shell: bash
        env:
          HEAD_SHA: ${{ steps.get_sha.outputs.sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::HEAD_SHA (Release の commit SHA) が空です"
            exit 1
          fi

          set +e
          response=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/merges" \
            -f base=custom \
            -f head="$HEAD_SHA" \
            -f commit_message="chore: upstream Release を custom に自動マージ" 2>&1)
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 0 ] && [ -z "$response" ]; then
            result=up-to-date
          elif [ "$exit_code" -eq 0 ] && [ -n "$response" ]; then
            result=merged
          elif [ "$exit_code" -ne 0 ] && echo "$response" | grep -q "HTTP 409"; then
            result=conflict
          else
            echo "$response" >&2
            exit 1
          fi

          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "- merge result: $result" >> "$GITHUB_STEP_SUMMARY"

      # 入力: 前ステップの step output `result`
      # 処理: result が conflict の場合は、open な Release→custom PR が無け
      #       れば作成する。result が merged または up-to-date の場合は逆
      #       に、残存する open な Release→custom PR があれば close する
      #       (close 時に相手が既に closed/merged でも失敗にしない)
      - name: Reconcile sync PR
        id: reconcile
        shell: bash
        env:
          RESULT: ${{ steps.merge.outputs.result }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::error::RESULT (merge ステップの結果) が空です"
            exit 1
          fi

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base custom --head Release --state open --json number --jq '.[0].number // empty')

          case "$RESULT" in
            conflict)
              if [ -z "$pr_number" ]; then
                gh pr create --repo "$GITHUB_REPOSITORY" --base custom --head Release \
                  --title "upstream sync: Release → custom (conflict)" \
                  --body "upstream の Release を custom へ自動マージしようとしたところ、コンフリクトが発生しました。解決方法: custom から作業ブランチを作成し、Release をマージしてコンフリクトを解決したうえで、PR で custom へ取り込んでください。取り込み完了後、この PR は次回の同期実行時に自動で close されます。"
                echo "- created conflict PR" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- conflict PR already open (#$pr_number)" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            merged|up-to-date)
              if [ -n "$pr_number" ]; then
                gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" --comment "custom へ取り込み済みのため close します" || true
                echo "- closed sync PR (#$pr_number)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- no open sync PR to close" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            *)
              echo "::error::想定外の RESULT 値です: $RESULT"
              exit 1
              ;;
          esac
